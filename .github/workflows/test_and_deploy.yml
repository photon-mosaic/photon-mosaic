name: tests and deploy

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
    tags:
      - "*"

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit

    - name: Run pre-commit checks
      run: pre-commit run --all-files

  tests:
    needs: linting
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,widgets]"

    - name: Run tests with pytest
      run: |
        pytest -m "not network" --cov --cov-report=xml --cov-report=term

  check_tag:
    name: Check if trigger is a tag on main
    runs-on: ubuntu-latest
    outputs:
      tag_on_main: ${{ steps.check.outputs.tag_on_main }}
    steps:
    - uses: neuroinformatics-unit/actions/check_tag_on_main@34bedfdfd70c6010be02182c9ca37fae8a1fd99d # v3.0.0
      id: check

  # Build and publish only for a pushed tag that points to a commit on main
  build_sdist_wheels:
    name: Build source distribution
    needs: [tests, check_tag]
    if: github.event_name == 'push' && needs.check_tag.outputs.tag_on_main == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: neuroinformatics-unit/actions/build_sdist_wheels@34bedfdfd70c6010be02182c9ca37fae8a1fd99d # v3.0.0

  upload_all:
    name: Publish build distributions
    needs: [build_sdist_wheels, check_tag]
    if: github.event_name == 'push' && needs.check_tag.outputs.tag_on_main == 'true'
    runs-on: ubuntu-latest
    environment: # use Trusted Publisher route
      name: pypi
      url: https://pypi.org/p/photon-mosaic
    permissions:
      id-token: write # mandatory for trusted publishing
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: artifact
        path: dist
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

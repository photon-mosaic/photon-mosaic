name: benchmarks

on:
  # Manual trigger — run whenever you want cross-OS results
  workflow_dispatch:
    inputs:
      grid_size:
        description: "Which grid to run"
        required: true
        default: "small"
        type: choice
        options:
          - small
          - large
          - all

  # Optionally auto-run on dev pushes (uncomment if desired)
  # push:
  #   branches: [dev]

jobs:
  benchmark:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]  # single Python version to limit cost

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install matplotlib

    - name: Determine benchmark marker
      id: marker
      shell: bash
      run: |
        GRID="${{ github.event.inputs.grid_size || 'small' }}"
        if [ "$GRID" = "all" ]; then
          echo "expr=grid" >> "$GITHUB_OUTPUT"
        else
          echo "expr=grid and $GRID" >> "$GITHUB_OUTPUT"
        fi

    - name: Run benchmarks
      run: |
        pytest -m "${{ steps.marker.outputs.expr }}" \
          --benchmark-json=benchmark_results_${{ matrix.os }}.json \
          --benchmark-disable-gc \
          --no-header -q

    - name: Generate summary plots
      if: always()
      run: |
        python src/photon_mosaic/core/tests/summarise_benchmarks.py \
          benchmark_results_${{ matrix.os }}.json \
          --plot \
          --plot-dir benchmark_plots_${{ matrix.os }} \
          --csv benchmark_results_${{ matrix.os }}.csv \
          --no-colour

    - name: Upload benchmark artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmarks-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          benchmark_results_${{ matrix.os }}.json
          benchmark_results_${{ matrix.os }}.csv
          benchmark_plots_${{ matrix.os }}/

  # Combine all OS results into a single summary
  summarise:
    needs: benchmark
    runs-on: ubuntu-latest
    if: always()
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install matplotlib

    - name: Download all benchmark artifacts
      uses: actions/download-artifact@v4
      with:
        path: all_benchmarks
        pattern: benchmarks-*
        merge-multiple: true

    - name: List downloaded files
      run: find all_benchmarks -type f | sort

    - name: Generate per-OS plots
      run: |
        for json_file in all_benchmarks/benchmark_results_*.json; do
          os_name=$(basename "$json_file" .json | sed 's/benchmark_results_//')
          python src/photon_mosaic/core/tests/summarise_benchmarks.py \
            "$json_file" \
            --plot \
            --plot-dir combined_plots \
            --csv "combined_plots/results_${os_name}.csv" \
            --no-colour || true
        done

    - name: Upload combined summary
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-summary-all-os
        path: combined_plots/

name: tests and linting

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit

    - name: Run pre-commit checks
      run: pre-commit run --all-files

  tests:
    needs: linting
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache Suite2p sample data
      uses: actions/cache@v4
      with:
        path: ~/.photon-mosaic/sample_data/suite2p
        key: suite2p-sample-data
        enableCrossOsArchive: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,widgets]"

    - name: Run tests with pytest
      run: |
        pytest -m "not network" --cov --cov-report=xml --cov-report=term
